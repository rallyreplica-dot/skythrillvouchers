<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payment Successful | SkyThrill</title>
    <link rel="stylesheet" href="styles/main.css" />
    <script defer src="scripts/success.js"></script>
  </head>
  <body>
    <div class="cloud-layer" aria-hidden="true">
      <div class="cloud cloud-a"></div>
      <div class="cloud cloud-b"></div>
      <div class="cloud cloud-c"></div>
    </div>
    <main>
      <section class="hero reveal">
        <p class="eyebrow">Payment successful</p>
        <h1>Your voucher order is confirmed</h1>
        <p class="hero-copy">
          Thanks for your purchase. We have received your payment and your voucher
          details are now being processed.
        </p>
        <p id="order-status-text">Preparing your payment confirmation...</p>
        <div class="hero-actions">
          <a class="btn" href="index.html">Return to home</a>
        </div>
      </section>
    </main>
  </body>
</html>
