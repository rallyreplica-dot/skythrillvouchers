<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payment Cancelled | SkyThrill</title>
    <link rel="stylesheet" href="styles/main.css" />
  </head>
  <body>
    <div class="cloud-layer" aria-hidden="true">
      <div class="cloud cloud-a"></div>
      <div class="cloud cloud-b"></div>
      <div class="cloud cloud-c"></div>
    </div>
    <main>
      <section class="hero reveal">
        <p class="eyebrow">Payment cancelled</p>
        <h1>Your checkout was not completed</h1>
        <p class="hero-copy">
          No payment was taken. You can go back and try checkout again whenever you are ready.
        </p>
        <div class="hero-actions">
          <a class="btn" href="index.html#voucher-form">Try checkout again</a>
        </div>
      </section>
    </main>
  </body>
</html>
